name: Python auth SDK

on:
  push:
    branches: ['main']
    tags:
      - 'auth-sdk-python-v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.12']
        pyjwt: ['2.8.0', '2.10.0', 'latest']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install '.[test]'

      - name: Install compatibility PyJWT version
        if: matrix.pyjwt != 'latest'
        run: python -m pip install 'PyJWT[crypto]==${{ matrix.pyjwt }}'

      - name: Test
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install build twine

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate_release.py

      - name: Build and check distributions
        run: python -m build && python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: auth-sdk-dist
          path: dist/*
          if-no-files-found: error

  verify-distributions:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        artifact: ['wheel', 'sdist']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: auth-sdk-dist
          path: dist
      - name: Install wheel
        if: matrix.artifact == 'wheel'
        run: python -m pip install dist/*.whl
      - name: Install source distribution
        if: matrix.artifact == 'sdist'
        run: python -m pip install dist/*.tar.gz
      - name: Smoke test installed distribution
        working-directory: /tmp
        run: python "$GITHUB_WORKSPACE/scripts/smoke_test_install.py"

  publish:
    if: startsWith(github.ref, 'refs/tags/auth-sdk-python-v')
    needs: verify-distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chaldeatrading-auth-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: auth-sdk-dist
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    if: startsWith(github.ref, 'refs/tags/auth-sdk-python-v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the published release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#auth-sdk-python-v}"
          for attempt in 1 2 3 4 5; do
            python -m pip install --no-cache-dir "chaldeatrading-auth-sdk[fastapi]==${version}" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 15
          done
      - name: Smoke test the published release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          import auth_sdk

          expected = os.environ["RELEASE_TAG"].removeprefix("auth-sdk-python-v")
          assert version("chaldeatrading-auth-sdk") == expected
          assert auth_sdk.AuthConfig
          assert auth_sdk.verify_token
          assert auth_sdk.require_user
          PY
