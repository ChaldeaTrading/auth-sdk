[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "chaldeatrading-auth-sdk"
version = "0.2.0"
description = "Framework-independent JWT authentication SDK"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "ChaldeaTrading" },
]
keywords = ["authentication", "jwt", "keycloak"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = ["PyJWT[crypto]>=2.8,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.111,<0.116"]
test = ["pytest>=8", "fastapi>=0.111,<0.116", "httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/ChaldeaTrading/auth-sdk"
Issues = "https://github.com/ChaldeaTrading/auth-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
