version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python -m pip install '.[test]' build twine
  pre_build:
    commands:
      - python -m pip install 'PyJWT[crypto]==2.8.0'
      - python -m pytest -q
      - python -m pip install 'PyJWT[crypto]==2.10.0'
      - python -m pytest -q
      - python -m pip install --upgrade 'PyJWT[crypto]>=2.8,<3'
      - python -m pytest -q
  build:
    commands:
      - python -m build
      - python -m twine check dist/*

artifacts:
  base-directory: dist
  files:
    - '*.whl'
    - '*.tar.gz'
